<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7c5cff"><title>Writing Vault — StudyNova Chinese</title><link rel="icon" href="assets/icon.svg"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="assets/styles.css"></head><body><div class="shell"><aside class="sidebar"><div class="brand"><img src="assets/icon.svg" alt=""><span>StudyNova<small>CHINESE LAB</small></span></div><nav class="nav"><a href="index.html"><svg class="icon" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8v9a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg><span id="backText">Tổng quan</span></a><a class="active" href="#"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg><span>Writing Vault</span></a></nav></aside><main class="main"><header class="topbar"><div><b>StudyNova Chinese</b><p class="lead" id="subtitle">Kho bài viết tiếng Trung cá nhân</p></div><div class="top-actions"><button class="icon-btn" id="langBtn">中文</button><a class="btn" href="index.html" id="backBtn">Quay lại</a></div></header><div class="section-head"><div><h1 id="title">写作 Writing Vault</h1><p class="lead" id="desc">Viết, lưu phiên bản và ghi lại phản hồi cho từng bài.</p></div><button class="btn primary" id="newBtn">Bài viết mới</button></div><div class="stats"><div class="card stat"><span class="label" id="essayLabel">Bài viết</span><strong id="essayCount">0</strong></div><div class="card stat"><span class="label" id="charLabel">Hán tự đã viết</span><strong id="charCount">0</strong></div><div class="card stat"><span class="label" id="topicLabel">Chủ đề</span><strong id="topicCount">0</strong></div><div class="card stat"><span class="label" id="correctionLabel">Phản hồi</span><strong id="correctionCount">0</strong></div></div><div class="vault-layout"><section><div class="section-head"><h2 id="listTitle">Bài viết gần đây</h2><input class="input" id="search" style="max-width:240px" placeholder="Tìm bài viết..."></div><div class="word-list" id="essayList"></div></section><section class="card" id="editor"><div class="empty"><div class="empty-icon"><svg class="icon" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/></svg></div><span id="selectHint">Chọn một bài viết hoặc tạo bài mới.</span></div></section></div></main></div><div class="toast" id="toast"></div><script>
const KEY='chinesewritingvault_data_v1';const defaults={essays:[],corrections:[],topics:['日常生活','学习与教育','旅行','工作','科技','文化'],importedVocab:[],darkMode:true,lastBackup:null};let S;try{S={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{S={...defaults}}S.essays=Array.isArray(S.essays)?S.essays:[];S.corrections=Array.isArray(S.corrections)?S.corrections:[];let lang='vi',active=null;
const tx={vi:{subtitle:'Kho bài viết tiếng Trung cá nhân',back:'Quay lại',home:'Tổng quan',desc:'Viết, lưu phiên bản và ghi lại phản hồi cho từng bài.',new:'Bài viết mới',essays:'Bài viết',chars:'Hán tự đã viết',topics:'Chủ đề',feedback:'Phản hồi',recent:'Bài viết gần đây',search:'Tìm bài viết...',hint:'Chọn một bài viết hoặc tạo bài mới.',untitled:'Chưa có tiêu đề',title:'Tiêu đề',topic:'Chủ đề',content:'Nội dung tiếng Trung',notes:'Ghi chú / phản hồi',save:'Lưu bài',remove:'Xóa bài',saved:'Đã lưu bài viết.',empty:'Chưa có bài viết nào.'},zh:{subtitle:'你的个人中文写作空间',back:'返回',home:'概览',desc:'写作、保存版本，并记录每篇文章的反馈。',new:'新建文章',essays:'文章',chars:'已写汉字',topics:'主题',feedback:'反馈',recent:'最近文章',search:'搜索文章……',hint:'选择一篇文章或新建文章。',untitled:'未命名文章',title:'标题',topic:'主题',content:'中文正文',notes:'笔记 / 反馈',save:'保存文章',remove:'删除文章',saved:'文章已保存。',empty:'还没有文章。'}};const t=k=>tx[lang][k];const save=()=>localStorage.setItem(KEY,JSON.stringify(S));const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function translate(){document.documentElement.lang=lang==='vi'?'vi':'zh-CN';subtitle.textContent=t('subtitle');backBtn.textContent=t('back');backText.textContent=t('home');desc.textContent=t('desc');newBtn.textContent=t('new');essayLabel.textContent=t('essays');charLabel.textContent=t('chars');topicLabel.textContent=t('topics');correctionLabel.textContent=t('feedback');listTitle.textContent=t('recent');search.placeholder=t('search');langBtn.textContent=lang==='vi'?'中文':'VI';render()}
function render(){const q=search.value.toLowerCase(),items=S.essays.filter(e=>(e.title+' '+e.content+' '+e.topic).toLowerCase().includes(q));essayList.innerHTML=items.length?items.map(e=>`<article class="card feature" data-id="${e.id}"><span class="label">${esc(e.topic||'—')}</span><h3>${esc(e.title||t('untitled'))}</h3><p>${esc((e.content||'').slice(0,90))}</p><small class="muted">${new Date(e.updatedAt||e.createdAt).toLocaleDateString()}</small></article>`).join(''):`<div class="card empty">${t('empty')}</div>`;essayList.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>edit(x.dataset.id));essayCount.textContent=S.essays.length;charCount.textContent=S.essays.reduce((n,e)=>n+((e.content||'').match(/[\u3400-\u9fff]/g)||[]).length,0);topicCount.textContent=new Set(S.essays.map(e=>e.topic).filter(Boolean)).size;correctionCount.textContent=S.essays.filter(e=>e.notes).length;if(active)edit(active,false)}
function edit(id,rerender=true){active=id;const e=S.essays.find(x=>x.id===id)||{id,createdAt:new Date().toISOString(),title:'',topic:'',content:'',notes:''};editor.innerHTML=`<form id="essayForm" class="form-grid"><div class="field full"><label>${t('title')}</label><input class="input" name="title" value="${esc(e.title)}"></div><div class="field full"><label>${t('topic')}</label><input class="input" name="topic" list="topics" value="${esc(e.topic)}"><datalist id="topics">${S.topics.map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></div><div class="field full"><label>${t('content')}</label><textarea class="input" name="content" style="min-height:260px">${esc(e.content)}</textarea></div><div class="field full"><label>${t('notes')}</label><textarea class="input" name="notes">${esc(e.notes)}</textarea></div><div class="actions"><button class="btn primary" type="submit">${t('save')}</button><button class="btn" type="button" id="deleteBtn">${t('remove')}</button></div></form>`;essayForm.onsubmit=ev=>{ev.preventDefault();const data=Object.fromEntries(new FormData(ev.target));const i=S.essays.findIndex(x=>x.id===id),value={...e,...data,updatedAt:new Date().toISOString()};if(i<0)S.essays.unshift(value);else S.essays[i]=value;if(data.topic&&!S.topics.includes(data.topic))S.topics.push(data.topic);save();toast(t('saved'));render()};deleteBtn.onclick=()=>{if(confirm(t('remove')+'?')){S.essays=S.essays.filter(x=>x.id!==id);active=null;save();editor.innerHTML=`<div class="empty">${t('hint')}</div>`;render()}}}
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1800)}const toastEl=document.getElementById('toast');newBtn.onclick=()=>edit(crypto.randomUUID());search.oninput=render;langBtn.onclick=()=>{lang=lang==='vi'?'zh':'vi';translate()};translate();if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');
</script></body></html>
